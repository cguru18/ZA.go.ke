# ═══════════════════════════════════════════════════════════════════════════════
# ZA.go.ke — Nginx Reverse Proxy + Load Balancer Configuration
# ═══════════════════════════════════════════════════════════════════════════════
#
# SETUP INSTRUCTIONS:
#   1. Copy this file to: /etc/nginx/sites-available/zago
#   2. Create symlink:    ln -s /etc/nginx/sites-available/zago /etc/nginx/sites-enabled/
#   3. Test config:       sudo nginx -t
#   4. Reload:            sudo systemctl reload nginx
#
# This config assumes:
#   - Node.js cluster runs on port 5000 (all workers share this port via OS)
#   - Frontend is served separately (e.g., Vercel, Netlify, or Nginx static)
#   - SSL is terminated at Nginx (certbot recommended for Let's Encrypt)
#
# ═══════════════════════════════════════════════════════════════════════════════

# ── Rate Limiting Zones ────────────────────────────────────────────────────────
# These are defined in the http{} context, outside server{} blocks.
# If using a standalone conf file, place these in nginx.conf's http{} block.

# General API rate limit: 10 req/sec per IP (burst up to 20)
# limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

# Strict rate limit for auth endpoints: 3 req/sec per IP
# limit_req_zone $binary_remote_addr zone=auth_limit:10m rate=3r/s;

# ── Upstream Block (Node.js Cluster) ──────────────────────────────────────────
# The OS kernel (REUSEPORT) already distributes connections across workers.
# We define a single upstream entry pointing to the shared cluster port.
upstream zago_backend {
    # Least-connections policy (better than round-robin for WebSocket longevity)
    least_conn;

    # Node.js cluster (all workers share port 5000 via SO_REUSEPORT)
    server 127.0.0.1:5000;

    # To run manual multiple instances on different ports, uncomment below:
    # server 127.0.0.1:5001;
    # server 127.0.0.1:5002;
    # server 127.0.0.1:5003;

    # Keep 32 persistent connections to backend workers in the pool
    keepalive 32;
}

# ── HTTP → HTTPS Redirect ──────────────────────────────────────────────────────
server {
    listen 80;
    server_name api.za.go.ke;
    return 301 https://$host$request_uri;
}

# ── Main HTTPS Server Block ────────────────────────────────────────────────────
server {
    listen 443 ssl http2;
    server_name api.za.go.ke;

    # ── SSL (managed by Certbot) ───────────────────────────────────────────
    ssl_certificate     /etc/letsencrypt/live/api.za.go.ke/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.za.go.ke/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # ── Security Headers ───────────────────────────────────────────────────
    add_header X-Frame-Options          "SAMEORIGIN"                  always;
    add_header X-Content-Type-Options   "nosniff"                     always;
    add_header X-XSS-Protection         "1; mode=block"              always;
    add_header Referrer-Policy          "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy       "geolocation=(), microphone=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # ── Gzip Compression ───────────────────────────────────────────────────
    gzip            on;
    gzip_vary       on;
    gzip_proxied    any;
    gzip_comp_level 6;
    gzip_types      text/plain text/css text/xml application/json
                    application/javascript application/xml+rss
                    application/atom+xml image/svg+xml;

    # ── Connection Settings ────────────────────────────────────────────────
    client_max_body_size    10M;
    keepalive_timeout       65;
    proxy_read_timeout      300s;  # Allow long WebSocket connections

    # ── Health Check (fast pass-through, no rate limit) ────────────────────
    location = /health {
        proxy_pass         http://zago_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        access_log         off;
    }

    # ── WebSocket Upgrade (Socket.io) ─────────────────────────────────────
    location /socket.io/ {
        proxy_pass             http://zago_backend;
        proxy_http_version     1.1;
        proxy_set_header       Upgrade    $http_upgrade;
        proxy_set_header       Connection "upgrade";
        proxy_set_header       Host       $host;
        proxy_set_header       X-Real-IP  $remote_addr;
        proxy_set_header       X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header       X-Forwarded-Proto $scheme;
        proxy_cache_bypass     $http_upgrade;
        proxy_read_timeout     3600s;   # Keep WebSocket alive for 1 hour
        proxy_send_timeout     3600s;
    }

    # ── Auth Endpoints (strict rate limit) ────────────────────────────────
    location ~ ^/api/auth/ {
        # limit_req zone=auth_limit burst=5 nodelay;
        proxy_pass         http://zago_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";
    }

    # ── General API Proxy ──────────────────────────────────────────────────
    location /api/ {
        # limit_req zone=api_limit burst=20 nodelay;
        proxy_pass         http://zago_backend;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        # Pass real client IP to express (enables req.ip in rate-limiter)
        proxy_set_header   X-Real-IP         $remote_addr;
    }

    # ── 404 for anything else ──────────────────────────────────────────────
    location / {
        return 404 '{"error":"Not Found"}';
        add_header Content-Type application/json;
    }

    # ── Logs ───────────────────────────────────────────────────────────────
    access_log /var/log/nginx/zago_access.log;
    error_log  /var/log/nginx/zago_error.log warn;
}
